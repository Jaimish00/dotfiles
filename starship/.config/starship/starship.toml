"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"

# -------------------------------
# General Prompt Settings
# -------------------------------
format = """
\n$username\
$hostname\
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$docker_context\
$helm\
$kubernetes\
$golang\
$nodejs\
$bun\
$aws\
$python\
$lua\
$cmd_duration $jobs $time\
$line_break\
$character"""

add_newline = true
command_timeout = 3600

# -------------------------------
# Prompt Appearance
# -------------------------------
[fill]
symbol = " "

[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
vimcmd_symbol = '[](bold purple)'
vimcmd_replace_one_symbol = '[](bold yellow)'
vimcmd_replace_symbol = '[](bold yellow)'
vimcmd_visual_symbol = '[󰒅](bold red)'

# -------------------------------
# Directory
# -------------------------------
[directory]
style = "blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

# -------------------------------
# Git
# -------------------------------
[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[git_status]
style = 'fg:mauve'
format = '([$all_status$ahead_behind]($style) )'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
disabled = false

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"
disabled = false

[git_metrics]
disabled = true

# -------------------------------
# Languages
# -------------------------------
# Node.js
[nodejs]
format = "[$symbol($version )]($style)"

# Bun
[bun]
symbol = " "
style = "yellow"
format = "[$symbol($version )]($style)"

# Python
[python]
style = "teal"
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
python_binary = 'python3'

# Go
[golang]
style = 'sapphire'
symbol = ' '
format = '[$symbol$version]($style) '

# Lua
[lua]
symbol = ' '

# -------------------------------
# Cloud & Containers
# -------------------------------
[aws]
disabled = false
symbol = " "
style = "peach"

# Now put symbol+profile in the same conditional group
format = '[($symbol $profile  )(\[$duration\] )]($style)'


[docker_context]
format = '[  $context  ]($style)'
style = "sapphire"
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

# Helm
[helm]
format = '[$symbol$version ]($style) '
symbol = ' '
style = 'blue'
detect_extensions = ['yaml', 'yml']
detect_files = ['Chart.yaml']

# Kubernetes
[kubernetes]
format = '[$symbol$context( \($namespace\))]($style) '
symbol = '󱃾 '
style = 'blue'
disabled = false

# -------------------------------
# System Info
# -------------------------------
[cmd_duration]
format = "[$duration]($style)"
style = "text"
min_time = 10_000  # Show command duration over 10,000 milliseconds (=10 sec)

[memory_usage]
symbol = " "

[time]
disabled = false
style = "yellow"
format = "[$time]($style)"

[os]
disabled = true
format = "$symbol "

[os.symbols]
Macos = ""

[sudo]
format = "$symbol"
style = 'bold green'
disabled = false

# -------------------------------
# Color Palette
# -------------------------------
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
