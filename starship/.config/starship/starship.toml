"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"

format = """
\n$username\
$hostname\
$hostname\
$os\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
$docker_context\
$golang\
$nodejs\
$python\
$cmd_duration $jobs $time\
$line_break\
$character"""

# Inserts a blank line between shell prompts
add_newline = true
command_timeout = 3600

[nodejs]
format = "[$symbol($version )]($style)"

[fill]
symbol = " "

[directory]
style = "blue"
read_only = " "
truncation_length = 4
truncate_to_repo = false

# [character]
# success_symbol = "[❯](white)"
# error_symbol = "[❯](red)"
# vicmd_symbol = "[❮](green)"
[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
vimcmd_symbol = '[](bold purple)'
vimcmd_replace_one_symbol = '[](bold yellow)'
vimcmd_replace_symbol = '[](bold yellow)'
vimcmd_visual_symbol = '[󰒅](bold red)'

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bright-black"

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
# symbol = "🐍 "
# Only use the `python3` binary to get the version.
python_binary = 'python3'

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
disabled = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"
disabled = false

[git_metrics]
disabled = true

[cmd_duration]
format = "[$duration]($style)"
style = "white"
min_time = 10_000  # Show command duration over 10,000 milliseconds (=10 sec)

[memory_usage]
symbol = " "

[docker_context]
format = '[🐋 $context  ]($style)'
style = "blue"

[time]
disabled = false
style = "yellow"
format = "[$time]($style)"

[os]
disabled = true
format = "$symbol "
symbols.Macos = ""

[sudo]
format = "$symbol"
style = 'bold green'
disabled = false

[golang]
format = '[$symbol$version]() '
style = "bold cyan"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
