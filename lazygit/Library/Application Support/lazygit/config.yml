nerdFontsVersion: "3"
gui:
  showIcons: true
  showFileTree: true # for rendering changes files in a tree format
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    cherryPickedCommitBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
    searchingActiveBorderColor:
      - '#f9e2af'

  authorColors:
    '*': '#b4befe'
git:
  paging:
    colorArg: always
    pager: delta --dark --paging=never

os:
  editPreset: 'nvim'
  edit: 'nvim {{filename}}'
  editInTerminal: true

keybinding:
  universal:
    quit: "q"
